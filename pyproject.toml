[project]
name = "stylesense"
version = "0.0.1"
description = "Fairness-aware beard and hairstyle recommendation with identity-preserving virtual try-on"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT (code only; see README for data and model licences)" }
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10.14",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7", "scikit-image>=0.22"]
# Training stack. Locally install the CPU wheels first:
#   uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
# On Kaggle / Colab, torch is preinstalled with CUDA.
train = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0", "scikit-learn>=1.4"]
data = ["kaggle>=1.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stylesense*"]

[tool.ruff]
line-length = 120
target-version = "py310"
# notebooks contain Jupyter shell magics; they are generated by scripts/make_kaggle_notebook.py, which is linted
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# keep pytest temp files on the project drive (not the system drive)
addopts = "--basetemp=.cache/pytest-tmp -p no:cacheprovider"
markers = ["needs_model: requires the MediaPipe face_landmarker.task model file"]
