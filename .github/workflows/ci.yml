name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]   # 3.13 matches the current Kaggle image
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: System libraries for OpenCV / MediaPipe
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1 libglib2.0-0 libegl1 libgles2
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,train]"
          uv pip install pytest-github-actions-annotate-failures
      - name: Versions
        run: uv run python -c "import cv2, mediapipe, numpy, torch; print(cv2.__version__, mediapipe.__version__, numpy.__version__, torch.__version__)"
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Download models
        run: uv run python scripts/download_models.py
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q -rfEs 2>&1 | tee pytest.log || {
            # surface the tail of the log as a public annotation (job logs need sign-in to read)
            tail -n 60 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | sed 's/^/::error title=pytest output::/'
            exit 1
          }
